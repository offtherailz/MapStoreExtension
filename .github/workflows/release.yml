# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2023.02.01 (make sure to execute on this on the release branch)'
        required: true
jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
    - name: npm install
      run: npm install
    - name: build
      run: npm run ext:build
  fix-version:
    # if: ${{ github.repository == 'geosolutions-it/MapStoreExtension' && github.ref != 'master' }}
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
    - name: Check branch
      if: ${{ github.repository != 'offtherailz/MapStoreExtension' || github.ref == 'master' }}
      uses: actions/github-script@v3
      with:
        script: |
            core.setFailed('This workflow can not run on master branch')
    - name: Checkout branch
      uses: actions/checkout@v3
    - name: submodule update
      run: git submodule update --init --recursive
    - name: Fix versions, commit and push new tag
      run: |
        git tag ${VERSION} # create tag
        git push origin ${{ github.ref_name }}
        echo "Snapshots version restored"
  release:
      runs-on: ubuntu-latest
      needs: [fix-version, build]
      concurrency: release-${{ github.ref }}
      steps:
        - name: create_release
          id: create_release
          uses: softprops/action-gh-release@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
          with:
            tag_name: "v${{ inputs.version }}"
            name: "${{ inputs.version }}"
            generate_release_notes: true
            draft: true
            prerelease: false
            files: ./dist/SampleExtension.zip
